<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMDB — Чёрная тема</title>
  <meta name="color-scheme" content="dark" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
 :root{
    --bg:#000000;
    --card:linear-gradient(to bottom, #27272763, #000000);
    --text:#e6e6ea;
    --muted:#9aa0a6;
    --accent:#22c55e;
    --radius:20px;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  
  /* From Uiverse.io by JaydipPrajapati1910 */ 
.loader {
  --path: #fff;
  --dot: red;
  --duration: 3s;
  width: 44px;
  height: 44px;
  position: relative;
}

.loader:before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  position: absolute;
  display: block;
  background: var(--dot);
  top: 37px;
  left: 19px;
  transform: translate(-18px, -18px);
  animation: dotRect var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
}

.loader svg {
  display: block;
  width: 100%;
  height: 100%;
}

.loader svg rect, .loader svg polygon, .loader svg circle {
  fill: none;
  stroke: var(--path);
  stroke-width: 10px;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.loader svg polygon {
  stroke-dasharray: 145 76 145 76;
  stroke-dashoffset: 0;
  animation: pathTriangle var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
}

.loader svg rect {
  stroke-dasharray: 192 64 192 64;
  stroke-dashoffset: 0;
  animation: pathRect 3s cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
}

.loader svg circle {
  stroke-dasharray: 150 50 150 50;
  stroke-dashoffset: 75;
  animation: pathCircle var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
}

.loader.triangle {
  width: 48px;
}

.loader.triangle:before {
  left: 21px;
  transform: translate(-10px, -18px);
  animation: dotTriangle var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
}

@keyframes pathTriangle {
  33% {
    stroke-dashoffset: 74;
  }

  66% {
    stroke-dashoffset: 147;
  }

  100% {
    stroke-dashoffset: 221;
  }
}

@keyframes dotTriangle {
  33% {
    transform: translate(0, 0);
  }

  66% {
    transform: translate(10px, -18px);
  }

  100% {
    transform: translate(-10px, -18px);
  }
}

@keyframes pathRect {
  25% {
    stroke-dashoffset: 64;
  }

  50% {
    stroke-dashoffset: 128;
  }

  75% {
    stroke-dashoffset: 192;
  }

  100% {
    stroke-dashoffset: 256;
  }
}

@keyframes dotRect {
  25% {
    transform: translate(0, 0);
  }

  50% {
    transform: translate(18px, -18px);
  }

  75% {
    transform: translate(0, -36px);
  }

  100% {
    transform: translate(-18px, -18px);
  }
}

@keyframes pathCircle {
  25% {
    stroke-dashoffset: 125;
  }

  50% {
    stroke-dashoffset: 175;
  }

  75% {
    stroke-dashoffset: 225;
  }

  100% {
    stroke-dashoffset: 275;
  }
}

.loader {
  display: inline-block;
  margin: 0 16px;
}

 
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Manrope', sans-serif;}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  a{text-decoration:none; color:inherit; transition:.3s}
  img{display:block; max-width:100%}

  /* Preloader */
  .preloader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:var(--bg);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity .5s ease;
  }
  .preloader.hidden{
    opacity:0;
    pointer-events:none;
  }
  
  /* Skeleton Loading */
  .skeleton{
    background:linear-gradient(90deg,rgba(255,255,255,.02) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.02) 75%);
    background-size:200% 100%;
    animation:shimmer 2s infinite;
    border-radius:var(--radius);
  }
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }
  .skeleton-text{height:20px; margin:8px 0; border-radius:10px}
  .skeleton-title{height:32px; margin:16px 0; border-radius:16px}
  .skeleton-circle{width:120px; height:120px; border-radius:50%; margin:auto}
  .skeleton-card{height:200px; margin:24px 0}

  /* Animations */
  .fade-in{opacity:0; transform:translateY(20px); transition:all .8s ease}
  .fade-in.visible{opacity:1; transform:translateY(0)}
  .hover-up{transition:transform .25s ease}
  .hover-up:hover{transform:translateY(-4px)}

  /* People cards animation */
  .person{
    text-align:center; 
    transition:all .4s ease;
    opacity:0;
    transform:translateY(20px) scale(0.9);
    animation:personFadeIn .6s ease forwards;
  }
  .person:nth-child(1){animation-delay:.1s}
  .person:nth-child(2){animation-delay:.2s}
  .person:nth-child(3){animation-delay:.3s}
  .person:nth-child(4){animation-delay:.4s}
  .person:nth-child(5){animation-delay:.5s}
  .person:nth-child(6){animation-delay:.6s}
  .person:nth-child(7){animation-delay:.7s}
  .person:nth-child(8){animation-delay:.8s}
  .person:nth-child(9){animation-delay:.9s}
  .person:nth-child(10){animation-delay:1s}
  .person:nth-child(11){animation-delay:1.1s}
  .person:nth-child(12){animation-delay:1.2s}
  .person:nth-child(13){animation-delay:1.3s}
  .person:nth-child(14){animation-delay:1.4s}
  .person:nth-child(15){animation-delay:1.5s}
  .person:nth-child(16){animation-delay:1.6s}
  .person:nth-child(17){animation-delay:1.7s}
  .person:nth-child(18){animation-delay:1.8s}

  @keyframes personFadeIn{
    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  .person:hover{
    transform:translateY(-5px) scale(1.02);
  }

  /* Hero */
  .hero{
    position:relative;
    min-height:80vh;
    display:flex; 
    align-items:flex-end;
    padding:20vh 24px 32px;
    background:#000;
    overflow:hidden;
  }

  .background-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover !important;
    background-position: center !important;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }

  .background-slide.active {
    opacity: 1;
  }

  .background-slide.blurred {
    filter: blur(0px);
    transform: scale(1.1);
  }

  @media (min-width: 769px) {
    .background-slide {
      background-size: 100% !important;
      background-position: top right !important;
    }
  }

  /* Убрано: .hero::after — теперь используется простой градиент в основном CSS */

  .wrap{position:relative; z-index:2; max-width:1200px; margin:auto; width:100%}

  /* Slideshow controls */
  .slideshow-controls {
    position: absolute;
    bottom: 100px;
    right: 30px;
    display: flex;
    gap: 10px;
    z-index: 3;
  }

  .slide-dot {
    width: 12px;
    height: 12px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 15px;
    cursor: pointer;
    position: relative;
    overflow: visible;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(1);
  }

  .slide-dot:hover {
    background: rgba(255, 255, 255, 0.6);
    transform: scale(1.1);
  }

  .slide-dot.active {
    background: rgba(255, 255, 255, 0.123);
    border-radius: 15px;
    width: 60px;
    height: 12px;
    transform: scale(1);
  }

  .slide-dot .progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background:  #ffffff63;
    border-radius: 15px;
    width: 0;
    border-radius: inherit;
    opacity: 0;
    transition: all 0.3s ease;
  }

  .slide-dot.active .progress {
    opacity: 1;
    animation: slideProgress 10s linear;
  }

  .slide-dot.transitioning {
    border-radius: 6px;
    width: 60px;
    height: 12px;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideProgress {
    0% { 
      width: 0; 
    }
    50% {
    }
    100% { 
      width: 100%; 
    }
  }

  @media (max-width: 768px) {
    .slideshow-controls {
      bottom: 80px;
      right: 20px;
      gap: 8px;
    }
    
    .slide-dot {
      width: 10px;
      height: 10px;
    }
    
    .slide-dot.active,
    .slide-dot.transitioning {
      width: 40px;
      height: 10px;
      border-radius: 5px;
    }
  }

 .meta, 
#extraMeta {
  display: flex !important;
  flex-direction: row !important; 
  flex-wrap: wrap;                
  gap: 8px;
}
  .content-id{
    color:rgba(133, 133, 133, 0.493); 
    font-size:20px; 
    font-weight:100;
    margin-bottom:16px;
    text-align:left;
  }
  
  .logo{max-width:480px; filter:drop-shadow(0 6px 24px rgba(0,0,0,.8))}
  .logo-text{color:rgba(200,200,200,0.6); font-size:24px; font-weight:600}

  /* Logo with title container */
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  
  .logo-with-title {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  
  .russian-title {
    color: var(--text);
    font-size: 32px;
    font-weight: 700;
    text-shadow: 0 4px 12px rgba(0,0,0,.6);
  }
  
  @media (max-width: 768px) {
    .russian-title {
      font-size: 24px;
    }
  }

  .meta{display:flex; flex-wrap:wrap; gap:12px; margin:14px 0}
  #extraMeta {
  display: flex;
  flex-wrap: wrap;   
  gap: 8px;          
}

.pill {
  position: relative;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(25px);
  font-size: 14px;
  white-space: nowrap;
  flex-shrink: 0;
  z-index: 0;
}

.pill::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.35),
    rgba(200, 200, 200, 0.15),
    rgba(255, 255, 255, 0.25),
    rgba(120, 120, 120, 0.1)
  );

  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box, 
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  pointer-events: none;
  z-index: -1;
}

  .actions{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap}
  .btn{cursor:pointer; border:none; border-radius:99px; padding:14px 35px; font-weight:700; font-size:15px; transition:.3s;font-family: 'Manrope';    border: 1px solid rgba(255,255,255,0.1);  backdrop-filter: blur(25px);}
  .btn-primary{background:var(--accent); color:#0b0b0f}
  .btn-ghost{background:rgba(255,255,255,.08); color:var(--text)}
  .btn:hover{transform:translateY(-2px)}

  .tagline{color:var(--muted); margin-top:8px}

  /* Details */
  .details{max-width:1200px; margin:40px auto; padding:0 24px; display:grid; gap:24px}
  .card{background:var(--card); border-top-left-radius: var(--radius);
  border-top-right-radius: var(--radius);
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0; box-shadow:var(--shadow); padding:22px}
  .card h2{margin-bottom:14px; font-size:22px; font-weight:700}

  .grid{display:grid; gap:24px}
  .grid.cols-2{grid-template-columns:1.1fr .9fr}
  @media(max-width:960px){.grid.cols-2{grid-template-columns:1fr}}

  .people-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:20px}
  .avatar{width:120px; height:120px; margin:auto; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.08); box-shadow:var(--shadow)}
  .avatar img{width:100%; height:100%; object-fit:cover; transition:all .4s ease}
  .person:hover .avatar img{transform:scale(1.1) rotate(2deg)}
  .person:hover .avatar{border-color:var(--accent); box-shadow:0 0 20px rgba(34, 197, 94, 0.3)}
  .name{font-weight:600; margin-top:10px; transition:color .3s ease}
  .person:hover .name{color:var(--accent)}
  .role{color:var(--muted); font-size:14px}

  .tabs{display:flex; gap:10px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:14px; flex-wrap:wrap}
  .tab-btn{
    background:none; 
    border:none; 
    color:var(--muted); 
    font-weight:600; 
    padding:10px 16px; 
    margin-bottom:6px;
    cursor:pointer; 
    border-radius:25px; 
    transition:all .4s ease;
    transform:scale(1);
  }
  .tab-btn:hover{
    color:#fff; 
    background:rgba(255,255,255,.04);
    transform:scale(1.05);
  }
  .tab-btn.active{
    color:#fff; 
    background:rgba(255,255,255,.08);
    transform:scale(1);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .tab-panel{
    display:none;
    opacity:0;
    transform:translateY(10px);
    transition:all .5s ease;
  }
  .tab-panel.active{
    display:block;
    opacity:1;
    transform:translateY(0);
    animation:tabFadeIn .5s ease forwards;
  }
  @keyframes tabFadeIn{
    from{opacity:0; transform:translateY(15px)}
    to{opacity:1; transform:translateY(0)}
  }

  /* Footer */
  .footer{
    text-align:center;
    padding:24px;
    color:rgba(200,200,200,0.4);
    font-size:12px;
    border-top:1px solid rgba(255,255,255,.08);
    margin-top:40px;
  }

  .extra-grid{
     display:grid;
     grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
     gap:12px;
   }

  /* Mobile Responsive */
  @media(max-width:768px){
    .hero{
      min-height:70vh;
      padding:15vh 16px 24px;
    }
    .content-id{
      font-size:16px;
      margin-bottom:12px;
    }
    .logo{
      max-width:320px;
    }
    .logo-text{
      font-size:20px;
    }
    .meta{
      gap:8px;
    }
    .pill{
      font-size:12px;
      padding:4px 8px;
    }
    .btn{
      padding:12px 18px;
      font-size:14px;
      border-radius: 25px;
    }
    .actions{
      gap:10px;
    }
    .details{
      padding:0 16px;
      margin:24px auto;
    }
    .card{
      padding:16px;
    }
    .card h2{
      font-size:20px;
    }
    .people-grid{
      grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
      gap:16px;
    }
    .avatar{
      width:80px;
      height:80px;
    }
    .name{
      font-size:14px;
    }
    .role{
      font-size:12px;
    }
    .extra-grid{
       grid-template-columns:1fr;
       gap:8px;
     }
           
    .tabs{
      gap:6px;
    }
    .tab-btn{
      padding:8px 12px;
      font-size:14px;
    }
  }

  @media(max-width:480px){
    .hero{
      padding:10vh 12px 20px;
    }
    .content-id{
      font-size:14px;
    }
    .logo{
      max-width:280px;
    }
    .logo-text{
      font-size:18px;
    }
    .meta{
      flex-direction:column;
      align-items:flex-start;
    }
    .actions{
      flex-direction:column;
      width:100%;
    }
    .btn{
      width:100%;
      text-align:center;
    }
    .grid.cols-2{
      grid-template-columns:1fr;
    }
    @media (max-width: 768px) {
  #watchLink,
  #trailerBtn {
    justify-content: center;
  }
  }

  .no-scroll {
     overflow: hidden !important;
   }
}
</style>

</head>
<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="loader">
        <svg viewBox="0 0 80 80">
            <circle r="32" cy="40" cx="40" id="test"></circle>
        </svg>
    </div>

    <div class="loader triangle">
        <svg viewBox="0 0 86 80">
            <polygon points="43 8 79 72 7 72"></polygon>
        </svg>
    </div>

    <div class="loader">
        <svg viewBox="0 0 80 80">
            <rect height="64" width="64" y="8" x="8"></rect>
        </svg>
    </div>
  </div>

  <header class="hero" id="hero">
    <div id="backgroundContainer"></div>
    
    <div class="slideshow-controls" id="slideshowControls"></div>
    
    <div class="wrap">
      <div class="content-id fade-in" id="contentId"></div>
      <div id="logoBox" class="fade-in"></div>
      <div class="meta fade-in">
        <div class="pill" id="releaseYear"></div>
        <div class="pill" id="seasonsOrDuration"></div>
        <div class="pill" id="age"></div>
        <div class="pill" id="rating"></div>
      </div>
      <p class="tagline fade-in" id="tagline"></p>
      <div class="actions fade-in">
        <button id="watchLink" class="btn btn-primary hover-up" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <img src="ico/смотреть.png" alt="Смотреть" style="width:26px; height:26px;" id="watchIcon">
          <span>Смотреть</span>
        </button>
        <script>
          const watchBtn = document.getElementById('watchLink');
          const watchIcon = document.getElementById('watchIcon');
          watchBtn.addEventListener('mouseenter', () => {
            watchIcon.src = 'ico/смотреть.apng';
          });
          watchBtn.addEventListener('mouseleave', () => {
            watchIcon.src = 'ico/смотреть.png';
          });
        </script>
          
        </button>
        <a id="trailerBtn" class="btn btn-ghost hover-up trailer-hover" target="_blank" style="display: flex; align-items: center; gap: 8px;">
          <img src="ico/ссылка.png" alt="Трейлер" style="width:16px; height:16px;" id="trailerIcon">
          <span>Трейлер</span>
        </a>
        <script>
          const trailerBtn = document.getElementById('trailerBtn');
          const trailerIcon = document.getElementById('trailerIcon');
          trailerBtn.addEventListener('mouseenter', () => {
           trailerBtn.style.background = '#fff';
           trailerBtn.style.color = '#000';
           trailerIcon.src = 'ico/ссылка.apng';
          });
          trailerBtn.addEventListener('mouseleave', () => {
           trailerBtn.style.background = 'rgba(255,255,255,.08)';
           trailerBtn.style.color = '';
           trailerIcon.src = 'ico/ссылка.png';
          });
        </script>
      </div>
    </div>
  </header>

  <main class="details">
    <!-- Loading skeletons -->
    <div id="loadingSkeletons" class="grid cols-2">
      <div class="card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:70%"></div>
      </div>
      <div class="card">
        <div class="skeleton skeleton-title"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px">
          <div class="text-center">
            <div class="skeleton skeleton-circle"></div>
            <div class="skeleton skeleton-text" style="margin-top:10px"></div>
          </div>
          <div class="text-center">
            <div class="skeleton skeleton-circle"></div>
            <div class="skeleton skeleton-text" style="margin-top:10px"></div>
          </div>
          <div class="text-center">
            <div class="skeleton skeleton-circle"></div>
            <div class="skeleton skeleton-text" style="margin-top:10px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Actual content -->
    <div id="actualContent" class="grid cols-2" style="display:none">
      <section class="card fade-in">
        <h2>Описание</h2>
        <p id="overview"></p>
      </section>
      <section class="card fade-in">
        <div class="tabs">
            <button class="tab-btn active" data-tab="creators" id="creatorsTab" style="display: flex; align-items: center; gap: 8px;">
              <img src="ico/создатель.png" alt="Создатель" style="width:16px; height:16px;"> <span>Создатели</span>
            </button>
            <button class="tab-btn" data-tab="actors" style="display: flex; align-items: center; gap: 8px;">
              <img src="ico/актеры.png" alt="Актёры" style="width:16px; height:16px;"> <span>Актёры</span>
            </button>
        </div>
        <div class="tab-panel active" id="panel-creators"><div class="people-grid" id="creators"></div></div>
        <div class="tab-panel" id="panel-actors"><div class="people-grid" id="actors"></div></div>
      </section>
    </div>
    
    <section class="card fade-in" id="extraSection" style="display:none">
       <h2>Дополнительно</h2>
       <div class="extra-grid" id="extraMeta"></div>
    </section>
  </main>

  <footer class="footer">
    Контент на сайте представлен в чисто развлекательных целях. Мы не несем ответственности за содержание и не призываем к нарушению авторских прав.
  </footer>

  <script>
    // Основной скрипт страницы
    const API_KEY='06936145fe8e20be28b02e26b55d3ce6';
    const TV_ID='';
    const M_ID='157336';
    const API='https://api.themoviedb.org/3';
    const IMG=(p,s='original')=>p?`https://image.tmdb.org/t/p/${s}${p}`:'';

    const $=s=>document.querySelector(s);
    const hero=$('#hero');
    const logoBox=$('#logoBox');
    const backgroundContainer=$('#backgroundContainer');
    const slideshowControls=$('#slideshowControls');
    const isTV = TV_ID && !M_ID;
    const contentType = isTV ? 'tv' : 'movie';
    const contentId = isTV ? TV_ID : M_ID;

    let currentSlide = 0;
    let slideInterval;
    let progressInterval;
    let backgrounds = [];

    function personCard({name,role,img}){
      const div=document.createElement('div');
      div.className='person fade-in';
      div.innerHTML=`<div class="avatar">${img?`<img src="${IMG(img,'w300')}" alt="${name}">`:''}</div><div class="name">${name}</div><div class="role">${role}</div>`;
      return div;
    }

    function hidePreloader() {
      const preloader = $('#preloader');
      preloader.classList.add('hidden');
      setTimeout(() => preloader.remove(), 500);
    }

    function showContent() {
      $('#loadingSkeletons').style.display = 'none';
      $('#actualContent').style.display = 'grid';
      $('#extraSection').style.display = 'block';
      
      setTimeout(() => {
        document.querySelectorAll('.fade-in').forEach(el => {
          el.classList.add('visible');
        });
      }, 100);
    }

    function createBackgroundSlides(images, usePosterFallback = false) {
      backgroundContainer.innerHTML = '';
      slideshowControls.innerHTML = '';
      
      backgrounds = images.slice(0, 5);
      
      // Если нет задника и используется постер как фон
      const blurClass = usePosterFallback ? 'blurred' : '';
      
      backgrounds.forEach((img, index) => {
        // Создаем фоновые слайды
        const slide = document.createElement('div');
        slide.className = `background-slide ${blurClass} ${index === 0 ? 'active' : ''}`;
        slide.style.backgroundImage = `url(${IMG(img)})`;
        backgroundContainer.appendChild(slide);
        
        // Создаем точки управления
        const dot = document.createElement('div');
        dot.className = `slide-dot ${index === 0 ? 'active' : ''}`;
        dot.innerHTML = '<div class="progress"></div>';
        dot.addEventListener('click', () => goToSlide(index));
        slideshowControls.appendChild(dot);
      });
      
      startSlideshow();
    }

    function goToSlide(index) {
      if (index === currentSlide) return;
      
      // Убираем активный класс у всех слайдов и точек
      document.querySelectorAll('.background-slide').forEach(slide => slide.classList.remove('active'));
      document.querySelectorAll('.slide-dot').forEach(dot => {
        dot.classList.remove('active');
        dot.classList.remove('transitioning');
      });
      
      // Добавляем класс перехода к новой точке
      const newDot = document.querySelectorAll('.slide-dot')[index];
      newDot.classList.add('transitioning');
      
      // Активируем новый слайд
      document.querySelectorAll('.background-slide')[index].classList.add('active');
      
      // Через небольшую задержку делаем точку активной с анимацией
      setTimeout(() => {
        newDot.classList.remove('transitioning');
        newDot.classList.add('active');
      }, 300);
      
      currentSlide = index;
      
      // Перезапускаем таймеры
      clearInterval(slideInterval);
      startSlideshow();
    }

    function nextSlide() {
      const nextIndex = (currentSlide + 1) % backgrounds.length;
      goToSlide(nextIndex);
    }

    function startSlideshow() {
      if (backgrounds.length <= 1) return;
      
      // Запускаем автоматическое переключение через 10 секунд
      slideInterval = setInterval(nextSlide, 10000);
    }

    function createLogoWithTitle(data, logo) {
      const title = isTV ? data.name : data.title;
      
      if (logo) {
        // Есть логотип
        if (logo.iso_639_1 === 'ru') {
          // Русский логотип - показываем только его
          return `<img class="logo" src="${IMG(logo.file_path,'w500')}" alt="Логотип">`;
        } else {
          // Не русский логотип - показываем логотип + русское название под ним
          return `
            <div class="logo-with-title">
              <img class="logo" src="${IMG(logo.file_path,'w500')}" alt="Логотип">
              <div class="russian-title">${title}</div>
            </div>
          `;
        }
      } else {
        // Нет логотипа - показываем только текст
        return `<div class="logo-text">${title}</div>`;
      }
    }

    async function load(){
      try {
        const appendToResponse = isTV ? 'credits,content_ratings,images,videos,external_ids' : 'credits,releases,images,videos,external_ids';
        const res=await fetch(`${API}/${contentType}/${contentId}?api_key=${API_KEY}&language=ru-RU&append_to_response=${appendToResponse}&include_image_language=ru,null,en`);
        const d=await res.json();

        // Устанавливаем ID контента
        $('#contentId').textContent = isTV ? `tv/${TV_ID}` : `film/${M_ID}`;

        // Создаем слайдшоу из доступных фонов или используем постер
        const allBackgrounds = [];
        let usePosterFallback = false;
        
        // Сначала пытаемся найти задники (backdrops)
        if (d.backdrop_path) allBackgrounds.push(d.backdrop_path);
        if (d.images?.backdrops) {
          d.images.backdrops.forEach(img => {
            if (img.file_path && !allBackgrounds.includes(img.file_path)) {
              allBackgrounds.push(img.file_path);
            }
          });
        }
        
        // Если нет задников, используем постер как фон с размытием
        if (allBackgrounds.length === 0 && d.poster_path) {
          allBackgrounds.push(d.poster_path);
          usePosterFallback = true;
        }
        
        if (allBackgrounds.length > 0) {
          createBackgroundSlides(allBackgrounds, usePosterFallback);
        }

        // Обрабатываем логотип и название
        const logos=d.images?.logos||[];
        // Приоритет: русский логотип > английский > любой другой
        const ruLogo = logos.find(l=>l.iso_639_1==='ru');
        const enLogo = logos.find(l=>l.iso_639_1==='en');
        const anyLogo = logos[0];
        
        const selectedLogo = ruLogo || enLogo || anyLogo;
        logoBox.innerHTML = createLogoWithTitle(d, selectedLogo);

        // Год выхода
        const releaseDate = isTV ? d.first_air_date : d.release_date;
        $('#releaseYear').textContent=(releaseDate||'').slice(0,4);

        // Сезоны/продолжительность
        if(isTV) {
          const seasons = d.number_of_seasons;
          const episodes = d.number_of_episodes;
          $('#seasonsOrDuration').innerHTML = `${seasons}сез/${episodes}э`;
        } else {
          const runtime = d.runtime;
          if(runtime) {
            const hours = Math.floor(runtime / 60);
            const minutes = runtime % 60;
            $('#seasonsOrDuration').textContent = `${hours}ч${minutes}м`;
          } else {
            $('#seasonsOrDuration').textContent = 'N/A';
          }
        }

        // Возрастной рейтинг
        let rating = '';
        if(isTV) {
          rating = (d.content_ratings?.results||[]).find(x=>x.iso_3166_1==='RU')?.rating||'';
        } else {
          rating = (d.releases?.countries||[]).find(x=>x.iso_3166_1==='RU')?.certification||'';
        }
        $('#age').textContent=rating||'N/A';
        
        $('#rating').textContent='TMDB: '+(d.vote_average||0).toFixed(1);

        $('#tagline').textContent=d.tagline||'';
        
        // Настраиваем кнопку "Смотреть" для открытия плеера
        const watchBtn = $('#watchLink');
        watchBtn.onclick = function() {
            // Извлекаем ID из contentId (убираем префикс film/ или tv/)
            const id = contentId.replace(/^(film|tv)\//, '');
            if (window.multiPlayer) {
              window.multiPlayer.playContent(id, contentType);
            }
        };

        // Трейлер
        const trailer=(d.videos?.results||[]).find(v=>v.type==='Trailer'&&v.site==='YouTube');
        if(trailer) $('#trailerBtn').href=`https://www.youtube.com/watch?v=${trailer.key}`;
        else $('#trailerBtn').style.display='none';

        $('#overview').textContent=d.overview||'Описание отсутствует';

        // Создатели/режиссеры
        const creators=$('#creators');
        const creatorsTab=$('#creatorsTab');
        
        if(isTV) {
          creatorsTab.innerHTML = '<img src="ico/создатель.png" alt="Создатель" style="width:16px; height:16px;"> <span>Создатели</span>';
          (d.created_by||[]).forEach(p=>creators.appendChild(personCard({name:p.name,role:'Создатель',img:p.profile_path})));
        } else {
          creatorsTab.innerHTML = '<img src="ico/создатель.png" alt="Создатель" style="width:16px; height:16px;"> <span>Режиссеры</span>';
          const directors = (d.credits?.crew||[]).filter(p=>p.job==='Director');
          directors.forEach(p=>creators.appendChild(personCard({name:p.name,role:'Режиссер',img:p.profile_path})));
        }

        // Актеры
        const actors=$('#actors');
        (d.credits?.cast||[]).slice(0,18).forEach(p=>actors.appendChild(personCard({name:p.name,role:p.character,img:p.profile_path})));

        // Дополнительная информация
        const genres = (d.genres||[]).map(g=>g.name).join(', ') || 'Нет данных';
        const status = d.status || 'Нет данных';
        const originalTitle = isTV ? d.original_name : d.original_title;
        const popularity = Math.round(d.popularity || 0);
        const voteCount = d.vote_count || 0;
        
        let extraInfo = `
          <div class="pill">Жанры: ${genres}</div>
          <div class="pill">Статус: ${status}</div>
          <div class="pill">Оригинальное название: ${originalTitle}</div>
          <div class="pill">Популярность: ${popularity}</div>
          <div class="pill">Количество голосов: ${voteCount}</div>
        `;

        // Добавляем специфичную информацию
        if(isTV) {
          const networks = (d.networks||[]).map(n=>n.name).join(', ') || 'N/A';
          const lastAirDate = d.last_air_date ? new Date(d.last_air_date).toLocaleDateString('ru-RU') : 'N/A';
          extraInfo += `
            <div class="pill">Телесеть: ${networks}</div>
            <div class="pill">Последний эфир: ${lastAirDate}</div>
          `;
        } else {
          const budget = d.budget ? d.budget.toLocaleString('ru-RU') : 'N/A';
          const revenue = d.revenue ? d.revenue.toLocaleString('ru-RU') : 'N/A';
          const productionCompanies = (d.production_companies||[]).map(c=>c.name).slice(0,3).join(', ') || 'N/A';
          extraInfo += `
            <div class="pill">Бюджет: ${budget}</div>
            <div class="pill">Сборы: ${revenue}</div>
            <div class="pill">Продюсеры: ${productionCompanies}</div>
          `;
        }
        
        $('#extraMeta').innerHTML = extraInfo;

        // Показываем контент и скрываем прелоадер
        setTimeout(() => {
          hidePreloader();
          showContent();
        }, 1500);

      } catch (error) {
        console.error('Ошибка загрузки:', error);
        setTimeout(() => {
          hidePreloader();
          showContent();
        }, 2000);
      }
    }

    document.addEventListener('click',e=>{
      const btn=e.target.closest('.tab-btn');
      if(!btn)return;
      
      // Плавное скрытие текущего контента
      const currentPanel = document.querySelector('.tab-panel.active');
      if(currentPanel) {
        currentPanel.style.opacity = '0';
        currentPanel.style.transform = 'translateY(-10px)';
        
        setTimeout(() => {
          // Убираем активный класс у всех кнопок и панелей
          document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
          
          // Добавляем активный класс новой кнопке и панели
          btn.classList.add('active');
          const newPanel = document.querySelector(`#panel-${btn.dataset.tab}`);
          newPanel.classList.add('active');
          
          // Перезапускаем анимации для карточек людей
          const people = newPanel.querySelectorAll('.person');
          people.forEach((person, index) => {
            person.style.animation = 'none';
            person.style.opacity = '0';
            person.style.transform = 'translateY(20px) scale(0.9)';
            
            setTimeout(() => {
              person.style.animation = `personFadeIn .6s ease forwards`;
              person.style.animationDelay = `${(index + 1) * 0.1}s`;
            }, 50);
          });
        }, 200);
      }
    });

    // Запуск загрузки
    load();
  </script>
</body>
</html>
