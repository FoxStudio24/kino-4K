<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ошибка 404 — Страница не найдена</title>
  <link rel="stylesheet" href="style.css" />
    <style>
       * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", sans-serif;
  background-size: cover;
  background-position: center;
  height: 100vh;
  color: white;
  position: relative;
}

.overlay {
  background-color: rgba(0, 0, 0, 0.6);
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.content h1 {
  font-size: 3em;
  margin-bottom: 0.5em;
}

.content p {
  font-size: 1.2em;
  margin-bottom: 1.5em;
  max-width: 600px;
}

.btn {
  background-color: #ffffff;
  color: #000;
  text-decoration: none;
  padding: 0.8em 1.5em;
  border-radius: 6px;
  font-weight: bold;
  transition: background 0.3s ease;
}

.btn:hover {
  background-color: #e3e3e3;
}

.error-code {
  margin-top: 2em;
  font-size: 1.2em;
}

.red-line {
  display: inline-block;
  background-color: red;
  width: 5px;
  height: 20px;
  margin-right: 10px;
  vertical-align: middle;
}

.movie-info {
  position: absolute;
  bottom: 15px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9em;
  opacity: 0.9;
}

.movie-info img {
  height: 60px;
  border-radius: 5px;
}

    </style>
</head>
<body>
  <div class="overlay">
    <div class="content">
      <h1>Заблудились?</h1>
      <p>Извините, мы не можем найти эту страницу. Вы найдете много интересного на домашней странице.</p>
      <a href="/" class="btn">Главная страница</a>
      <div class="error-code"><span class="red-line"></span> Код ошибки: <strong>404</strong></div>
    </div>
    <div class="movie-info" id="movieInfo"></div>
  </div>

  <script>
    const API_KEY = "06936145fe8e20be28b02e26b55d3ce6";
    const BASE_URL = "https://api.themoviedb.org/3";

    async function getRandomMovieBackdrop() {
      try {
        const res = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ru-RU&page=1`);
        const data = await res.json();
        const movie = data.results.find(m => m.backdrop_path);
        const bgUrl = `https://image.tmdb.org/t/p/original${movie.backdrop_path}`;
        document.body.style.backgroundImage = `url(${bgUrl})`;

        document.getElementById("movieInfo").innerHTML = `
          <img src="https://image.tmdb.org/t/p/w200${movie.poster_path}" alt="${movie.title}" />
          <span>${movie.title}</span>
        `;
      } catch (error) {
        console.error("Ошибка при загрузке фона:", error);
      }
    }

    getRandomMovieBackdrop();
  </script>
</body>
</html>
