<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - 404</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #2196f3;
            margin: 0;
            font-family: 'textbold', sans-serif;
        }
        
        .error-title {
            font-size: 2rem;
            margin: 20px 0;
            color: white;
            font-family: 'textbold', sans-serif;
        }
        
        .error-description {
            font-size: 1.2rem;
            color: #b3b3b3;
            margin-bottom: 30px;
            max-width: 500px;
            line-height: 1.5;
            font-family: 'textregular', sans-serif;
        }
        
        .error-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .error-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s ease;
            font-family: 'buttonbold', sans-serif;
        }
        
        .error-btn:hover {
            transform: scale(1.05);
        }
        
        .btn-primary {
            background-color: #2196f3;
            color: white;
        }
        
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.13);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
            
            .error-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .error-btn {
                width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Заблудились?</h2>
        <p class="error-description">
            Похоже, вы попали не туда. Страница, которую вы ищете, не существует или была перемещена. 
            Но не волнуйтесь - главная страница поможет вам найти нужное.
        </p>
        <div class="error-buttons">
            <a href="index.html" class="error-btn btn-primary">
                🏠 Главная страница
            </a>
            <a href="movies.html" class="error-btn btn-secondary">
                🎬 Фильмы
            </a>
            <a href="series.html" class="error-btn btn-secondary">
                📺 Сериалы
            </a>
        </div>
    </div>
</body>
</html>
