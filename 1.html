<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Через IMDB ID - The Boys (Пацаны) -->
    <iframe 
        src="https://gencit.info/nba/tt1190634" 
        allow="autoplay" 
        allowfullscreen="allowfullscreen" 
        webkitallowfullscreen 
        mozallowfullscreen 
        oallowfullscreen 
        msallowfullscreen>
    </iframe>
    
    <script src="https://replacedomain.github.io/loader.js"></script>
</body>
</html>
