    <body>
        <header>
            <div class="header-content">
                <form id="search-form">
                    <input id="search-input" type="text" placeholder="Ведите запрос"/>
                    <button type="submit" class="search-button">
                        <img src="icons/S30.png" alt="Поиск" class="search-icon"/>
                    </button>
                </form>
                <button id="open-favorites" class="favorites-button">
                    <img src="icons/F30.png" alt="Избранное" class="favorites-icon"/>
                </button>
            </div>
        </header>
        <main>
            <section id="new-releases" class="section fullscreen-section">
                <div class="fullscreen-slider">
                    <button class="slider-button prev">❮</button>
                    <div id="new-releases-grid" class="fullscreen-container"></div>
                    <button class="slider-button next">❯</button>
                </div>
            </section>
            <section id="popular-movies" class="section">
                <h2>Популярные фильмы</h2>
                <div class="movie-slider">
                    <button class="slider-button prev">❮</button>
                    <div id="popular-movies-grid" class="slider-container"></div>
                    <button class="slider-button next">❯</button>
                </div>
            </section>
            <section id="top-rated-tv" class="section">
                <h2>Лучшие сериалы</h2>
                <div class="movie-slider">
                    <button class="slider-button prev">❮</button>
                    <div id="top-rated-tv-grid" class="slider-container"></div>
                    <button class="slider-button next">❯</button>
                </div>
            </section>
            <section id="animated-movies" class="section">
                <h2>Мультфильмы</h2>
                <div class="movie-slider">
                    <button class="slider-button prev">❮</button>
                    <div id="animated-movies-grid" class="slider-container"></div>
                    <button class="slider-button next">❯</button>
                </div>
            </section>

            <!-- Landing Page Section -->
            <section id="featured-movie" class="landing-section">
                <div class="container">
                    <div class="content">
                        <div class="header">
                            <img src="logo/logo.png" alt="Logo" class="logo">
                            <div class="info-block">
                                <span class="rating">8.4</span>
                                <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" 
                                     alt="TMDB Logo" 
                                     class="tmdb-logo">
                            </div>
                        </div>
                        <div class="description">
                            <p>После кораблекрушения, умный робот по имени Роз оказывается на необитаемом острове. Чтобы выжить в суровых условиях, Роз налаживает связь с животными острова и заботится об одиноком гусенке-сироте..</p>
                        </div>
                    </div>

                    <div class="player-wrapper">
                        <video id="player" playsinline controls>
                            <source src="https://phantom.stream.voidboost.cc/bb3b84c2ad041176e4cc7bfd50620b30:2024122618:VU91SENWL2ZjbVRRcXE1YnY1QjJFSUc5cm1DQnV0RTdhb2FHMU81Z01yWG1xcWkweHlaaFZaYVBlaVN5MGdLRTlDVTlsaVl0RmNqR1M5bm1OdEdIY1E9PQ==/1/1/4/4/8/3/7/hptch.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </section>
        </main>

        <div id="movie-info-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">
                    <img src="icons/close24.png" alt="Закрыть" class="close-icon"/>
                </span>
                <div id="movie-info-content"></div>
            </div>
        </div>
        <div id="favorites" class="modal">
            <div class="modal-content">
                <span class="close-modal">
                    <img src="icons/close24.png" alt="Закрыть" class="close-icon"/>
                </span>
                <h2>Избранное</h2>
                <div id="favorites-grid" class="movies-grid"></div>
            </div>
        </div>
        <div id="search-results" class="modal">
            <div class="modal-content">
                <span class="close-modal">
                    <img src="icons/close24.png" alt="Закрыть" class="close-icon"/>
                </span>
                <h2>Результаты поиска</h2>
                <div id="search-results-grid" class="movies-grid"></div>
            </div>
        </div>
        
        <script src="https://kinobox.tv/kinobox.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js"></script>
        <script src="script.js"></script>
        <script>
            const player = new Plyr('#player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'fullscreen', 'speed']
            });
            player.speed = 1;
        </script>
    </body>
</html>
